PKGNAME=nuitkastandalone-0.1
PKGPATH=misc/nuitkastandalone
COMMENT="Standalone Python program compiled with Nuitka"
DESC="The nuitkademo program as a Nuitka standalone build: runs without the python package."
# Only needed in the sysroot: the libraries and extension modules are copied into the package.
DEPS=python%3.14
BUILD=nuitka
NUITKA_MODE=standalone
NUITKA_MAIN=../nuitkademo/nuitkademo.py
NUITKA_NAME=nuitkastandalone
