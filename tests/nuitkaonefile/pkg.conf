PKGNAME=nuitkaonefile-0.1
PKGPATH=misc/nuitkaonefile
COMMENT="Single-file Python program compiled with Nuitka"
DESC="The nuitkademo program as a Nuitka onefile build: one executable that unpacks itself to /tmp and runs without the python package."
# Only needed in the sysroot: the libraries and extension modules are packed into the executable.
DEPS=python%3.14
BUILD=nuitka
NUITKA_MODE=onefile
NUITKA_MAIN=../nuitkademo/nuitkademo.py
NUITKA_NAME=nuitkaonefile
