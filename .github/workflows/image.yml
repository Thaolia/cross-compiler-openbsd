name: toolchain image

on:
  push:
    branches: [main]
    paths: [docker/**, src/**, .github/workflows/image.yml]
  schedule:
    # -current moves every day; rebuild its sysroot nightly.
    - cron: "17 4 * * *"
  workflow_dispatch:

# Nothing by default; each job asks only for what it uses.
permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        flavor: ["8.0", "current"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # keep the token out of .git/config (mounted in the container/VM)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case image name (ghcr requirement)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openbsd-cross" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          build-args: OPENBSD_FLAVOR=${{ matrix.flavor }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ matrix.flavor }}
