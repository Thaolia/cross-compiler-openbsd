name: toolchain image

on:
  push:
    branches: [main]
    paths: [docker/**, src/**, .github/workflows/image.yml]
  schedule:
    # -current moves every day; rebuild its sysroot nightly.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: ["8.0", "current"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lower-case image name (ghcr requirement)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openbsd-cross" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: OPENBSD_FLAVOR=${{ matrix.flavor }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ matrix.flavor }}
