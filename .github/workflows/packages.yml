name: example packages

# Builds the examples in tests/ with the toolchain image, then installs and runs them
# on a real OpenBSD VM. Signing (optional):
#   repository variable PKG_KEY_NAME = e.g. "myproject-pkg"
#   repository secret   PKG_SECKEY   = content of myproject-pkg.sec (signify -n key)
#   public key committed as assets/pkg-keys/myproject-pkg.pub

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A change to the image's inputs builds the image first; workflow_run below then runs this
    # workflow on it. paths-ignore only skips pushes changing nothing else: the changes job
    # handles mixed ones.
    paths-ignore: [docker/**, src/**, .github/workflows/image.yml]
  pull_request:
  workflow_dispatch:
  # Rebuild the examples with each new toolchain image (the push that changes src/ starts both workflows at once).
  workflow_run:
    workflows: ["toolchain image"]
    types: [completed]

# Nothing by default; each job asks only for what it uses.
permissions: {}

jobs:
  # Did this push to main also change the image's inputs (the paths of image.yml)? Then the
  # toolchain image is being rebuilt, and a build here would use the old one: skip it, the
  # workflow_run started by the new image tests the push.
  changes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          image=false
          # BEFORE is unknown after a force push: build, rather than skip the test.
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null &&
             git diff --name-only "$BEFORE" "$GITHUB_SHA" |
               grep -qE '^(docker/|src/|\.github/workflows/image\.yml$)'; then
            image=true
          fi
          echo "image=$image" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: >-
      !cancelled() && needs.changes.result != 'failure' && needs.changes.outputs.image != 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        flavor: ["8.0", "current"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # keep the token out of .git/config (mounted in the container/VM)
      # ghcr packages are private by default: pulling the toolchain image needs a login too.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare
        env:
          PKG_SECKEY: ${{ secrets.PKG_SECKEY }}
          PKG_KEY_NAME: ${{ vars.PKG_KEY_NAME }}
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/openbsd-cross:${{ matrix.flavor }}" >> "$GITHUB_ENV"
          mkdir -p .keys out
          if [ -n "$PKG_SECKEY" ] && [ -n "$PKG_KEY_NAME" ]; then
            umask 077
            printf '%s\n' "$PKG_SECKEY" > ".keys/$PKG_KEY_NAME.sec"
            echo "KEYARG=.keys/$PKG_KEY_NAME.sec" >> "$GITHUB_ENV"
          fi
      - name: Cross-build and package
        run: |
          # root in the container: pkg-fetch installs dependencies into the image sysroot.
          docker run --rm -v "$PWD:/work" -w /work \
            -e KEYARG="${KEYARG:-}" -e FLAVOR="${{ matrix.flavor }}" "$IMAGE" sh -ec '
            for ex in jqdemo sdl2demo nuitkademo nuitkastandalone nuitkaonefile; do
              tests/build-example.sh "tests/$ex" "$FLAVOR" "out/$FLAVOR" $KEYARG
            done'
          sudo chown -R "$(id -u):$(id -g)" out
      - name: Remove key
        if: always()
        run: rm -rf .keys
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.flavor }}
          path: out/${{ matrix.flavor }}/*.tgz

  # The implicit success() fails when any upstream job, even an indirect one, was skipped: changes
  # is skipped outside pushes to main, so test-stable and release test their direct need instead.
  test-stable:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # keep the token out of .git/config (mounted in the container/VM)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages-8.0
          path: out
      - name: Install and run on OpenBSD 8.0
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          release: "8.0"
          usesh: true
          run: |
            set -ex
            uname -a
            if [ -n "${{ vars.PKG_KEY_NAME }}" ]; then
              cp "assets/pkg-keys/${{ vars.PKG_KEY_NAME }}.pub" /etc/signify/
              ADD="pkg_add"
            else
              ADD="pkg_add -D unsigned"
            fi
            # Standalone first, while python is not installed: it must run without it, through
            # the bin/ symlink, with libpython and extension modules from its own directory.
            $ADD ./out/nuitkastandalone-0.1.tgz
            pkg_info -f nuitkastandalone
            pkg_info -e 'python->=3' || echo "python not installed (expected)"
            sa=/usr/local/libexec/nuitkastandalone
            ldd $sa/nuitkastandalone | tee /tmp/sa.ldd
            grep -q "$sa/libpython3.14.so" /tmp/sa.ldd
            /usr/local/bin/nuitkastandalone > /tmp/sa.json
            cat /tmp/sa.json
            grep -q "\"prefix\": \"$sa\"" /tmp/sa.json
            grep -q "\"executable\": \"$sa/python3.14\"" /tmp/sa.json
            grep -q '"soabi": "cpython-314"' /tmp/sa.json
            pkg_delete nuitkastandalone
            # Onefile: one executable that unpacks itself to /tmp (normally not wxallowed), runs
            # from there, then removes its temporary directory.
            $ADD ./out/nuitkaonefile-0.1.tgz
            pkg_info -f nuitkaonefile
            /usr/local/bin/nuitkaonefile > /tmp/of.json
            cat /tmp/of.json
            grep -q '"prefix": "/tmp/onefile_' /tmp/of.json
            grep -q '"soabi": "cpython-314"' /tmp/of.json
            if ls -d /tmp/onefile_* 2>/dev/null; then echo "temporary directory left"; exit 1; fi
            pkg_delete nuitkaonefile
            # nuitkademo pulls the official python-3.14 package from the mirror (@depend).
            $ADD ./out/jqdemo-0.1.tgz ./out/sdl2demo-0.1.tgz ./out/nuitkademo-0.1.tgz
            pkg_info -f jqdemo sdl2demo nuitkademo
            /usr/local/bin/jqdemo
            SDL_VIDEODRIVER=dummy /usr/local/bin/sdl2demo 1
            /usr/local/bin/nuitkademo > /tmp/nuitkademo.json
            cat /tmp/nuitkademo.json
            grep -q '"prefix": "/usr/local"' /tmp/nuitkademo.json
            grep -q '"executable": "/usr/local/bin/python3.14"' /tmp/nuitkademo.json
            grep -q '"soabi": "cpython-314"' /tmp/nuitkademo.json
            pkg_delete jqdemo sdl2demo nuitkademo

  release:
    if: ${{ !cancelled() && needs.test-stable.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs: test-stable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in dist/packages-*; do
            f=${d#dist/packages-}
            for p in "$d"/*.tgz; do cp "$p" "dist/openbsd-$f-$(basename "$p")"; done
          done
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/openbsd-*.tgz
